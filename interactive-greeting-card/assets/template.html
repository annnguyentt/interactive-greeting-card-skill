<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:type" content="website">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESCRIPTION__">
<meta name="theme-color" content="#ffffff">
<style>
/*__FONTS__*/
:root {
  --ink: #17151a;
  --faint: rgba(23, 21, 26, 0.08);
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
html, body {
  margin: 0;
  height: 100%;
  background: #ffffff;
  color: var(--ink);
}
.gc {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #ffffff;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--sans);
}
.gc-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.gc[data-ready] .gc-canvas { opacity: 1; }
.gc-canvas[data-grabbing] { cursor: grabbing !important; }

.gc-loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
  font-size: 13px;
  color: rgba(23, 21, 26, 0.45);
  transition: opacity 0.4s ease;
}
.gc[data-ready] .gc-loading, .gc[data-failed] .gc-loading { opacity: 0; pointer-events: none; }

.gc-head {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  left: 0;
  right: 0;
  z-index: 2;
  text-align: center;
  padding: 0 16px;
  pointer-events: none;
  transition: opacity 0.8s ease 0.3s;
}
.gc:not([data-ready]) .gc-head { opacity: 0; }
.gc-heading {
  margin: 0;
  font-family: 'Caveat', cursive;
  font-weight: 600;
  font-size: clamp(26px, 4.4vw, 40px);
  line-height: 1.05;
  letter-spacing: 0.01em;
}
.gc-sub {
  margin: 4px 0 0;
  font-size: 13px;
  color: rgba(23, 21, 26, 0.55);
}

.gc-hint {
  position: absolute;
  left: 50%;
  bottom: calc(max(24px, env(safe-area-inset-bottom)) + 70px);
  transform: translateX(-50%);
  margin: 0;
  max-width: calc(100vw - 32px);
  font-size: 13px;
  text-align: center;
  color: rgba(23, 21, 26, 0.5);
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.gc:not([data-ready]) .gc-hint, .gc-hint[data-gone] { opacity: 0; }

.gc-dock {
  position: absolute;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: calc(100vw - 32px);
  padding: 7px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid var(--faint);
  box-shadow: 0 10px 30px -12px rgba(23, 21, 26, 0.18);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  transition: opacity 0.8s ease 0.2s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
}
.gc:not([data-ready]) .gc-dock { opacity: 0; transform: translate(-50%, 12px); }
.gc-rail {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding-block: 10px;
  margin-block: -10px;
}
.gc-rail::-webkit-scrollbar { display: none; }
.gc-rail[hidden], .gc-divider[hidden], .gc-tool[hidden] { display: none; }
.gc-thumb {
  flex: none;
  width: 48px;
  height: 48px;
  padding: 5px;
  border: 0;
  border-radius: 13px;
  background: transparent;
  cursor: pointer;
  transition: background 0.3s ease;
}
.gc-thumb:hover { background: rgba(23, 21, 26, 0.04); }
.gc-thumb img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0.55;
  filter: saturate(0.4) drop-shadow(0 2px 3px rgba(23, 21, 26, 0.18));
  transform: scale(0.86);
  transition: opacity 0.35s ease, filter 0.35s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.gc-thumb[data-active] img {
  opacity: 1;
  filter: saturate(1) drop-shadow(0 6px 10px rgba(23, 21, 26, 0.28));
  transform: scale(1.02) translateY(-3px);
}
.gc-divider {
  flex: none;
  align-self: stretch;
  width: 1px;
  margin: 8px 2px;
  background: var(--faint);
}
.gc-tool {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.25s ease, color 0.25s ease;
}
.gc-tool:hover { background: rgba(23, 21, 26, 0.05); }
.gc-tool[data-on] { background: var(--ink); color: #ffffff; }
.gc-tool:focus-visible, .gc-thumb:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

.gc-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.gc-fallback {
  position: absolute;
  inset: 0;
  overflow: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 32px 16px;
  box-sizing: border-box;
}
.gc-fallback[hidden] { display: none; }
.gc-fallback img {
  max-width: min(420px, 100%);
  max-height: 70vh;
  box-shadow: 0 18px 40px -18px rgba(23, 21, 26, 0.35);
}
.gc-letter {
  max-width: 360px;
  margin: 0;
  white-space: pre-wrap;
  font-family: 'Caveat', cursive;
  font-size: 28px;
  line-height: 1.2;
}
.gc[data-failed] .gc-canvas, .gc[data-failed] .gc-dock, .gc[data-failed] .gc-hint { display: none; }

@media (max-width: 720px) {
  .gc-dock { padding: 5px; gap: 2px; bottom: max(16px, env(safe-area-inset-bottom)); }
  .gc-hint { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); }
  .gc-thumb { width: 42px; height: 42px; padding: 4px; }
  .gc-tool { width: 40px; height: 40px; }
}
.gc[data-record] .gc-dock, .gc[data-record] .gc-hint, .gc[data-record] .gc-head, .gc[data-record] .gc-loading { display: none; }
@media (prefers-reduced-motion: reduce) {
  .gc-dock, .gc-hint, .gc-canvas, .gc-head { transition: none; }
}
</style>
</head>
<body>
<main class="gc">
  <canvas class="gc-canvas" aria-label="__CANVAS_LABEL__"></canvas>
  <p class="gc-loading">Opening the envelope…</p>
  <header class="gc-head" hidden>
    <h1 class="gc-heading"></h1>
    <p class="gc-sub"></p>
  </header>
  <p class="gc-hint">__HINT__</p>
  <nav class="gc-dock" aria-label="Card">
    <div class="gc-rail" hidden></div>
    <span class="gc-divider" hidden></span>
    <button type="button" class="gc-tool" data-act="open" aria-label="Open the card" aria-pressed="false" title="Open (O)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M9 4h11v16H9z"/><path d="M9 4 3.5 6.5v15.5L9 20"/></svg>
    </button>
    <button type="button" class="gc-tool" data-act="turn" aria-label="Turn the card over" title="Turn over (T)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/></svg>
    </button>
  </nav>
  <p class="gc-sr" aria-live="polite"></p>
  <div class="gc-fallback" hidden>
    <img alt="">
    <p class="gc-letter"></p>
  </div>
</main>
<script id="card-data" type="application/json">__CARD_DATA__</script>
<script>__RENDERER__</script>
</body>
</html>
